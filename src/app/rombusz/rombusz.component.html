<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <section class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-4 text-center">ROMBUSZ SZÁMÍTÁS</h1>

        <form [formGroup]="rombuszForm" (ngSubmit)="calculate()">
          <div class="mb-3">
            <label for="diagonalE" class="form-label">
              Átló (E)
              @if(rombuszForm.get('diagonalE')?.hasError('required') && rombuszForm.get('diagonalE')?.touched) {
                <span class="text-danger small ms-2">Kötelező megadni</span>
              }
              @if(rombuszForm.get('diagonalE')?.hasError('min') && rombuszForm.get('diagonalE')?.touched) {
                <span class="text-danger small ms-2">Minimum 1-nek kell lennie</span>
              }
            </label>
            <input type="number" id="diagonalE" formControlName="diagonalE" class="form-control">
          </div>

          <div class="mb-3">
            <label for="diagonalF" class="form-label">
              Átló (F)
              @if(rombuszForm.get('diagonalF')?.hasError('required') && rombuszForm.get('diagonalF')?.touched) {
                <span class="text-danger small ms-2">Kötelező megadni</span>
              }
              @if(rombuszForm.get('diagonalF')?.hasError('min') && rombuszForm.get('diagonalF')?.touched) {
                <span class="text-danger small ms-2">Minimum 1-nek kell lennie</span>
              }
            </label>
            <input type="number" id="diagonalF" formControlName="diagonalF" class="form-control">
          </div>

          <button class="btn btn-primary">Számítás</button>

          @if(showArea) {
            <div class="mt-3">
              <label for="area" class="form-label">Terület</label>
              <input type="text" id="area" formControlName="area" class="form-control">
            </div>
          }
        </form>
      </div>
    </section>
  </div>
</div>
